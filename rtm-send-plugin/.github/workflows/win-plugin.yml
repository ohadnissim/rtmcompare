name: Build RTM Send (Windows)

# Builds the Windows VST3 + Standalone for RTM Send on a hosted
# Windows runner, wraps them in an NSIS installer, and uploads the
# result as a workflow artifact (or a Release asset on tag push).
#
# Manual trigger: Actions → "Build RTM Send (Windows)" → Run workflow
# Tag trigger:    git tag rtm-send-v1.2.0 && git push --tags
# Push trigger:   any push to main
#
# Optional Authenticode signing — set these secrets to enable:
#   WIN_PFX_BASE64    base64-encoded Authenticode .pfx (Sectigo/DigiCert)
#   WIN_PFX_PASSWORD  password protecting the .pfx
# Without them the build still produces a working unsigned installer;
# Windows SmartScreen will warn users on first run.
#
# LOW-16: AAX build target is NOT included here because:
#   1. The Avid AAX SDK is proprietary and cannot be stored in a public repo.
#   2. Windows AAX builds additionally require a machine-specific Pace iLok
#      wraptool to sign the plugin.
# To add an AAX CI job: store the AAX SDK as a GitHub secret (ZIP, base64)
# and set AAX_SDK_PATH pointing to the extracted directory, then add the
# JUCE_AAX_SDK_PATH CMake variable to the cmake configure step.

on:
  push:
    branches: [main]
    tags:
      - 'rtm-send-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MED-20: read plugin version from CMakeLists.txt so the workflow
      # never needs manual bumping when the version changes.
      - name: Extract version from CMakeLists.txt
        id: version
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(RtmSend VERSION ([0-9]+\.[0-9]+\.[0-9]+)\)').Matches[0].Groups[1].Value
          if (-not $ver) { Write-Error "Could not parse version from CMakeLists.txt"; exit 1 }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Plugin version: $ver"
        shell: pwsh

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: C:\JUCE
          key: juce-8.0.12

      - name: Clone JUCE 8.0.12
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git C:\JUCE
        shell: pwsh

      - name: Cache ARA SDK
        id: cache-ara
        uses: actions/cache@v4
        with:
          path: C:\ARA_SDK
          key: ara-sdk-main-2024

      - name: Clone ARA SDK
        if: steps.cache-ara.outputs.cache-hit != 'true'
        run: git clone --depth 1 https://github.com/Celemony/ARA_SDK.git C:\ARA_SDK
        shell: pwsh

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DJUCE_DIR=C:\JUCE `
            -DARA_SDK_PATH=C:\ARA_SDK `
            -DJUCE_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build VST3 + Standalone
        run: cmake --build build --config Release --parallel
        shell: pwsh

      - name: Resolve artefact paths
        id: paths
        run: |
          $artefacts = "build\RtmSend_artefacts\Release"
          $vst3 = Get-ChildItem -Path "$artefacts\VST3" -Filter "RTM Send.vst3" -Directory | Select-Object -First 1
          if (-not $vst3) { Write-Error "VST3 bundle not found in $artefacts\VST3"; exit 1 }
          $vst3Bin = Get-ChildItem -Recurse -Path $vst3.FullName -Filter "RTM Send.vst3" -File | Select-Object -First 1
          if (-not $vst3Bin) { Write-Error "VST3 binary not found inside $($vst3.FullName)"; exit 1 }
          "vst3_dir=$($vst3.FullName)"                          >> $env:GITHUB_OUTPUT
          "vst3_bin=$($vst3Bin.FullName)"                       >> $env:GITHUB_OUTPUT
          "release_dir=$((Resolve-Path $artefacts).Path)"       >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Decode signing cert
        id: cert
        if: env.WIN_PFX_BASE64 != ''
        env:
          WIN_PFX_BASE64: ${{ secrets.WIN_PFX_BASE64 }}
        run: |
          $bytes = [System.Convert]::FromBase64String($env:WIN_PFX_BASE64)
          $path = Join-Path $env:RUNNER_TEMP "rtm-send.pfx"
          [System.IO.File]::WriteAllBytes($path, $bytes)
          "cert_path=$path" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Sign VST3 binary
        if: steps.cert.outputs.cert_path != ''
        env:
          PFX_PATH:     ${{ steps.cert.outputs.cert_path }}
          PFX_PASSWORD: ${{ secrets.WIN_PFX_PASSWORD }}
          VST3_BIN:     ${{ steps.paths.outputs.vst3_bin }}
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                       Where-Object { $_.Directory.Name -eq 'x64' } |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f $env:PFX_PATH /p $env:PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            $env:VST3_BIN
        shell: pwsh

      - name: Install NSIS
        run: choco install nsis -y --no-progress
        shell: pwsh

      - name: Build NSIS installer
        env:
          PLUGIN_DIR: ${{ steps.paths.outputs.release_dir }}
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { Write-Error "makensis.exe not found"; exit 1 }
          & $makensis /DPLUGIN_DIR="$env:PLUGIN_DIR" scripts\build_win_installer.nsi
        shell: pwsh

      - name: Sign installer
        if: steps.cert.outputs.cert_path != ''
        env:
          PFX_PATH:     ${{ steps.cert.outputs.cert_path }}
          PFX_PASSWORD: ${{ secrets.WIN_PFX_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                       Where-Object { $_.Directory.Name -eq 'x64' } |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f $env:PFX_PATH /p $env:PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            scripts\RTM-Send-${{ steps.version.outputs.version }}-Setup.exe
        shell: pwsh

      - name: SHA-256
        run: |
          $installer = "scripts\RTM-Send-${{ steps.version.outputs.version }}-Setup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          [System.IO.File]::WriteAllText("$installer.sha256", "$hash  RTM-Send-${{ steps.version.outputs.version }}-Setup.exe`n",
            [System.Text.ASCIIEncoding]::new())
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTM-Send-Windows-${{ steps.version.outputs.version }}
          path: |
            scripts/RTM-Send-${{ steps.version.outputs.version }}-Setup.exe
            scripts/RTM-Send-${{ steps.version.outputs.version }}-Setup.exe.sha256

      - name: Upload raw VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTM-Send-VST3-raw-${{ steps.version.outputs.version }}
          path: ${{ steps.paths.outputs.vst3_dir }}

      - name: Attach to Release on tag push
        if: startsWith(github.ref, 'refs/tags/rtm-send-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            scripts/RTM-Send-${{ steps.version.outputs.version }}-Setup.exe
            scripts/RTM-Send-${{ steps.version.outputs.version }}-Setup.exe.sha256
