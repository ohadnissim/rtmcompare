<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <!--
    5.2.2 hardening (audit P1): mirror the parent app's CSP + font system
    so a future renderer XSS doesn't escalate via our four IPC handlers,
    and so the Console-Didone display face actually appears.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: file:; media-src 'self' blob: data: file:; connect-src 'self' http://localhost:5174 ws://localhost:5174; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>RTMprofile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /*
      5.2.2 baseline (audit P0): body type bumped from 11–12 px (sub-WCAG)
      to 14 px / 1.55 line-height. Focus indicators added globally
      because every input had `outline: none` with no replacement —
      keyboard users were stranded.
    */
    /* 5.2.4: aligned with RTMcompare v5.2 Console Didone shell.
       Background switched from #1c1a17 (warm dark) to #0e0d0b (ink)
       so RTMprofile and RTMcompare share the same field. Body type
       stays Outfit at 14px / 1.55. */
    :root {
      --role-mastering: #7B4FFF;
      --role-mixing: #00E5FF;
      --role-tracking: #FFB830;
      --role-default: #7B4FFF;
    }
    html, body, #root {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0e0d0b;
      color: #c9c3b7;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }
    /* Only suppress text selection on the drag/chrome regions, not data
       output. Users need to copy file paths and error messages. */
    .drag-region {
      -webkit-user-select: none;
      user-select: none;
      -webkit-app-region: drag;
    }
    *:focus-visible {
      outline: 2px solid #d0b066;
      outline-offset: 2px;
      border-radius: 2px;
    }
    /* Console-Didone display face — used for the wordmark and any
       hero numerals. 5.2.4: italic dropped from the default style;
       opt in via `.display-serif.italic` where editorial italic is
       called for. The wordmark itself stays upright to match
       RTMcompare's HeaderV2. */
    .display-serif {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: normal;
      letter-spacing: -0.005em;
    }
    .display-serif.italic,
    .display-serif-italic {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      letter-spacing: -0.005em;
    }
    .mono {
      font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace;
    }
    /* ── Animated audio-bars build indicator ── */
    .audio-bars {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 24px;
    }
    .audio-bars .bar {
      width: 4px;
      background: var(--role-mastering, #7B4FFF);
      border-radius: 2px;
      animation: bar-pulse 1.2s ease-in-out infinite;
    }
    .audio-bars .bar:nth-child(1) { animation-delay: 0s;   height: 8px;  }
    .audio-bars .bar:nth-child(2) { animation-delay: 0.2s; height: 16px; }
    .audio-bars .bar:nth-child(3) { animation-delay: 0.4s; height: 24px; }
    .audio-bars .bar:nth-child(4) { animation-delay: 0.2s; height: 16px; }
    .audio-bars .bar:nth-child(5) { animation-delay: 0s;   height: 8px;  }
    @keyframes bar-pulse {
      0%, 100% { opacity: 0.4; transform: scaleY(0.5); }
      50%       { opacity: 1;   transform: scaleY(1);   }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
