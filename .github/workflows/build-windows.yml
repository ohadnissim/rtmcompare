name: Build Windows bundle

# Two ways to trigger:
#   1. Push a tag like v5.7.1 — produces a versioned artifact + Release asset.
#   2. Click "Run workflow" in the Actions tab — uses the version from package.json.
#
# What it builds (all on one windows-latest runner):
#   - RTMsend VST3 plugin (cmake/MSVC) + NSIS plugin installer
#   - RTMcompare Electron app (nsis + portable)
#   - RTMprofile Electron app (nsis + portable)
#   - ZIP bundle with all of the above + Documentation PDFs
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to upload to a Release when triggered by tag

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # ── Versions ───────────────────────────────────────────────────
      - name: Read versions
        id: versions
        shell: pwsh
        run: |
          $rtm     = (Get-Content package.json | ConvertFrom-Json).version
          $profile = (Get-Content rtm-profile-app/package.json | ConvertFrom-Json).version
          echo "rtm=$rtm"         >> $env:GITHUB_OUTPUT
          echo "profile=$profile" >> $env:GITHUB_OUTPUT
          Write-Host "RTMcompare $rtm  /  RTMprofile $profile"

      # ── JUCE ───────────────────────────────────────────────────────
      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: C:\JUCE
          key: juce-8.0.12

      - name: Clone JUCE 8.0.12
        if: steps.cache-juce.outputs.cache-hit != 'true'
        shell: pwsh
        run: git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git C:\JUCE

      # ── ARA SDK (optional — plugin builds without it too) ──────────
      - name: Cache ARA SDK
        id: cache-ara
        uses: actions/cache@v4
        with:
          path: C:\ARA_SDK
          key: ara-sdk-main-2024

      - name: Clone ARA SDK
        if: steps.cache-ara.outputs.cache-hit != 'true'
        shell: pwsh
        run: git clone --depth 1 https://github.com/Celemony/ARA_SDK.git C:\ARA_SDK

      # ── RTMsend VST3 build ────────────────────────────────────────
      - name: Configure RTMsend
        shell: pwsh
        run: |
          cmake -S rtm-send-plugin -B rtm-send-plugin/build-win `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DJUCE_DIR=C:\JUCE `
            -DARA_SDK_PATH=C:\ARA_SDK `
            -DJUCE_COPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build RTMsend VST3
        shell: pwsh
        run: cmake --build rtm-send-plugin/build-win --config Release --parallel

      - name: Resolve RTMsend artefact path
        id: plugin-paths
        shell: pwsh
        run: |
          $artefacts = "rtm-send-plugin\build-win\RtmSend_artefacts\Release"
          $resolved = (Resolve-Path $artefacts).Path
          echo "release_dir=$resolved" >> $env:GITHUB_OUTPUT

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build RTMsend NSIS installer
        shell: pwsh
        env:
          PLUGIN_DIR: ${{ steps.plugin-paths.outputs.release_dir }}
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { Write-Error "makensis.exe not found"; exit 1 }
          & $makensis /DPLUGIN_DIR="$env:PLUGIN_DIR" `
            rtm-send-plugin\scripts\build_win_installer.nsi

      # Optional Authenticode signing ───────────────────────────────
      - name: Decode signing cert
        id: cert
        if: env.WIN_PFX_BASE64 != ''
        env:
          WIN_PFX_BASE64: ${{ secrets.WIN_PFX_BASE64 }}
        shell: pwsh
        run: |
          $bytes = [System.Convert]::FromBase64String($env:WIN_PFX_BASE64)
          $path = Join-Path $env:RUNNER_TEMP "rtm.pfx"
          [System.IO.File]::WriteAllBytes($path, $bytes)
          "cert_path=$path" >> $env:GITHUB_OUTPUT

      - name: Sign RTMsend installer
        if: steps.cert.outputs.cert_path != ''
        shell: pwsh
        env:
          PFX_PATH:     ${{ steps.cert.outputs.cert_path }}
          PFX_PASSWORD: ${{ secrets.WIN_PFX_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                       Where-Object { $_.Directory.Name -eq 'x64' } |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f $env:PFX_PATH /p $env:PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            rtm-send-plugin\scripts\RTM-Send-1.2.0-Setup.exe

      # ── Python bundle ────────────────────────────────────────────
      - name: Cache python-bundle-win
        id: cache-pybundle
        uses: actions/cache@v4
        with:
          path: python-bundle-win
          key: pybundle-win-py3.11.9-full-dsp-stack-v5-stems-only

      - name: Build python-bundle-win
        if: steps.cache-pybundle.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pyVersion = '3.11.9'
          $url = "https://www.python.org/ftp/python/$pyVersion/python-$pyVersion-embed-amd64.zip"
          Write-Host "Downloading Python $pyVersion embeddable..."
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip

          New-Item -ItemType Directory -Force -Path python-bundle-win/python | Out-Null
          Expand-Archive -Path python-embed.zip -DestinationPath python-bundle-win/python -Force

          # Enable site-packages so pip-installed packages are importable.
          $pthFile = Get-ChildItem python-bundle-win/python -Filter 'python*._pth' | Select-Object -First 1
          (Get-Content $pthFile.FullName) -replace '^#import site', 'import site' | Set-Content $pthFile.FullName

          # Bootstrap pip.
          Invoke-WebRequest -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile get-pip.py
          .\python-bundle-win\python\python.exe get-pip.py --no-warn-script-location

          # DSP stack — mirrors the Mac bundle exactly.
          .\python-bundle-win\python\python.exe -m pip install `
            --no-warn-script-location `
            numpy scipy soundfile pyloudnorm `
            librosa numba demucs julius openunmix `
            "audio-separator>=0.30" "onnxruntime==1.19.2" "soxr>=0.5.0"

          # Smoke test.
          .\python-bundle-win\python\python.exe -c "
          import numpy, scipy, soundfile, pyloudnorm, librosa, numba, demucs, julius
          import onnxruntime, soxr, audio_separator
          print('OK', numpy.__version__, 'onnxruntime', onnxruntime.__version__)
          "

          Remove-Item python-embed.zip, get-pip.py

      # ── BS-RoFormer model weights ─────────────────────────────────
      - name: Cache BS-RoFormer ckpt
        id: cache-bsroformer
        uses: actions/cache@v4
        with:
          path: model-cache/uai_root/models
          key: bs-roformer-4stem-sdr-9.6568-v1

      - name: Download BS-RoFormer ckpt
        if: steps.cache-bsroformer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modelDir = "model-cache/uai_root/models"
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          $base = "https://github.com/ZFTurbo/Music-Source-Separation-Training/releases/download/v1.0.12"
          Write-Host "Downloading BS-RoFormer ckpt (~503 MB)..."
          Invoke-WebRequest -Uri "$base/model_bs_roformer_ep_17_sdr_9.6568.ckpt" `
            -OutFile "$modelDir/bs_roformer_4stem_ep_17_sdr_9.6568.ckpt"
          Invoke-WebRequest -Uri "$base/config_bs_roformer_384_8_2_485100.yaml" `
            -OutFile "$modelDir/bs_roformer_4stem_ep_17_sdr_9.6568.yaml"
          Get-ChildItem $modelDir | Format-List Name, Length

      # ── Node.js ───────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── RTMcompare Electron build ─────────────────────────────────
      - name: npm install (RTMcompare)
        run: npm install --no-audit --no-fund

      - name: Build RTMcompare for Windows
        run: npm run pack:win

      # ── RTMprofile Electron build ─────────────────────────────────
      - name: npm install (RTMprofile)
        working-directory: rtm-profile-app
        run: npm install --no-audit --no-fund

      - name: Build RTMprofile for Windows
        working-directory: rtm-profile-app
        run: npm run pack:win

      # ── Sign Electron apps (optional) ────────────────────────────
      - name: Sign RTMcompare + RTMprofile installers
        if: steps.cert.outputs.cert_path != ''
        shell: pwsh
        env:
          PFX_PATH:     ${{ steps.cert.outputs.cert_path }}
          PFX_PASSWORD: ${{ secrets.WIN_PFX_PASSWORD }}
          RTM_VERSION:  ${{ steps.versions.outputs.rtm }}
          PROF_VERSION: ${{ steps.versions.outputs.profile }}
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                       Where-Object { $_.Directory.Name -eq 'x64' } |
                       Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $targets = @(
            "release-build\RTMcompare Setup $env:RTM_VERSION.exe"
            "rtm-profile-app\release-build\RTMprofile Setup $env:PROF_VERSION.exe"
          )
          foreach ($t in $targets) {
            if (Test-Path $t) {
              & $signtool sign /f $env:PFX_PATH /p $env:PFX_PASSWORD `
                /tr http://timestamp.digicert.com /td sha256 /fd sha256 $t
            }
          }

      # ── Bundle ZIP ───────────────────────────────────────────────
      - name: Assemble Windows bundle
        id: bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version    = '${{ steps.versions.outputs.rtm }}'
          $profileVer = '${{ steps.versions.outputs.profile }}'
          $stage = "RTMcompare-bundle-$version-windows"

          New-Item -ItemType Directory -Force -Path "$stage/Documentation" | Out-Null

          # RTMcompare (installer + portable)
          $rtmSetup = "release-build\RTMcompare Setup $version.exe"
          if (Test-Path $rtmSetup) { Copy-Item $rtmSetup "$stage/" }
          $rtmPortable = "release-build\RTMcompare $version.exe"
          if (Test-Path $rtmPortable) { Copy-Item $rtmPortable "$stage/" }

          # RTMprofile (installer + portable)
          Get-ChildItem "rtm-profile-app\release-build\" -Filter "RTMprofile Setup *.exe" |
            Copy-Item -Destination "$stage/"
          Get-ChildItem "rtm-profile-app\release-build\" -Filter "RTMprofile *.exe" |
            Where-Object { $_.Name -notlike '* Setup *' } |
            Copy-Item -Destination "$stage/"

          # RTMsend plugin installer (built in this same job above)
          $pluginInstaller = "rtm-send-plugin\scripts\RTM-Send-1.2.0-Setup.exe"
          if (Test-Path $pluginInstaller) {
            Copy-Item $pluginInstaller "$stage/"
          } else {
            Write-Warning "RTM Send installer not found at $pluginInstaller — bundle will be incomplete"
          }

          # Documentation PDFs
          $docDir = "release/v$version"
          if (-not (Test-Path $docDir)) {
            $docDir = (Get-ChildItem release -Directory |
                       Where-Object Name -like 'v*' |
                       Sort-Object Name -Descending |
                       Select-Object -First 1).FullName
          }
          foreach ($pdf in @('MANUAL.pdf','FEATURES.pdf','PITCH-DECK.pdf','CHANGELOG.pdf')) {
            $dest = $pdf -replace 'PITCH-DECK','Pitch Deck' -replace '-',' ' -replace '\b(\w)', { $_.Groups[1].Value.ToUpper() }
            if (Test-Path "$docDir\$pdf") { Copy-Item "$docDir\$pdf" "$stage\Documentation\$dest" }
          }

          # README
          $readme = @"
RTMcompare bundle $version (Windows)

Three apps. One toolkit.

  RTMcompare Setup $version.exe    - the analyser. Run to install.
  RTMcompare $version.exe          - portable build, no install.
  RTMprofile Setup $profileVer.exe - profile builder. Run to install.
  RTMprofile $profileVer.exe       - portable build, no install.
  RTM-Send-1.2.0-Setup.exe         - VST3 + Standalone plugin installer.

Documentation\                     - Manual, Features, Pitch Deck (PDFs)

Notes:
- Everything runs locally. No telemetry, no cloud, no upload.
- Windows Defender SmartScreen may warn on first run of unsigned EXEs.
  Click "More info" then "Run anyway". EV code-signing is on the roadmap.

RTMcompare $version - (c) 2026 Ohad Nissim
"@
          [System.IO.File]::WriteAllText("$stage\README.txt",
            $readme.Replace("`r`n", "`n"),
            [System.Text.UTF8Encoding]::new($false))

          # ZIP
          $zipName = "$stage.zip"
          if (Test-Path $zipName) { Remove-Item $zipName }
          Compress-Archive -Path "$stage\*" -DestinationPath $zipName -CompressionLevel Optimal

          # SHA-256 (LF line endings so `shasum -c` works on macOS/Linux)
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          [System.IO.File]::WriteAllText("$zipName.sha256",
            "$hash  $zipName`n",
            [System.Text.ASCIIEncoding]::new())

          echo "zip=$zipName" >> $env:GITHUB_OUTPUT
          Get-Item $zipName | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.zip }}
          path: |
            ${{ steps.bundle.outputs.zip }}
            ${{ steps.bundle.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach to Release (tag triggers only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.bundle.outputs.zip }}
            ${{ steps.bundle.outputs.zip }}.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
